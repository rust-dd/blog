[package]
name = "blog"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
argon2 = { version = "0.5" }
axum = { version = "0.8", features = ["macros"] }
base64 = { version = "0.22" }
chrono = "0.4.38"
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dotenvy = "0.15.7"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
hmac = { version = "0.12" }
http = "1"
katex = { version = "0.4.6", default-features = false, features = ["duktape"] }
pulldown-cmark = { version = "0.12.0" }
regex = { version = "1.10.6" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rss = { version = "2.0.9" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10" }
surrealdb = { version = "3", features = ["protocol-http"] }
surrealdb-types = "3"
syntect = { version = "5.2.0", default-features = false, features = ["default-fancy", "html", "parsing", "plist-load", "regex-fancy", "yaml-load"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5.1" }
tower-http = { version = "0.6.2", features = ["fs", "trace", "cors", "compression-br", "compression-deflate", "compression-zstd", "compression-gzip"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.18" }
wasm-bindgen = "=0.2.108"

[dependencies]
argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
dioxus = { workspace = true }
dotenvy = { workspace = true }
getrandom = { workspace = true }
getrandom_02 = { workspace = true }
hmac = { workspace = true, optional = true }
http = { workspace = true }
katex = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rss = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
surrealdb-types = { workspace = true }
syntect = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:surrealdb", "dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "dep:tracing", "dep:syntect", "dep:regex", "dep:pulldown-cmark", "dep:rss", "dep:tracing-subscriber", "dep:katex", "dep:reqwest", "dep:argon2", "dep:base64", "dep:hmac", "dep:sha2"]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "admin_credentials"
required-features = ["server"]
